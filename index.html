<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Backtest Journal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono','Courier New',monospace;background:#0b0e14;min-height:100vh;color:#c8cdd8;}
input,select,textarea{background:#141820;border:1px solid #2a2f3d;color:#c8cdd8;border-radius:6px;padding:8px 12px;font-family:inherit;font-size:13px;outline:none;transition:border 0.2s;width:100%;}
input:focus,select:focus,textarea:focus{border-color:#00e5a0;}
select option{background:#141820;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#2a2f3d;border-radius:2px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const SYMBOLS = {
  futures: ["NQ","ES","YM","RTY","CL","GC","SI","NKD","FDAX","HSI","MNQ","MES"],
  forex: ["EURUSD","GBPUSD","USDJPY","AUDUSD","USDCAD","NZDUSD","EURGBP","GBPJPY","EURJPY","XAUUSD"],
  crypto: ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","ADAUSDT","DOGEUSDT","AVAXUSDT"],
};
const SETUPS = ["H1 趨勢多","H1 趨勢空","H1 CRT","M5 FVG"];
const emptyForm = {date:new Date().toISOString().slice(0,10),category:"futures",symbol:"",direction:"多",entry:"",exit:"",size:"",setups:[],note:""};

function fmt(v){
  if(v===null||isNaN(v))return"—";
  const n=parseFloat(v);return(n>=0?"+":"")+n.toFixed(2);
}

function App(){
  const [trades,setTrades]=useState(()=>{try{return JSON.parse(localStorage.getItem("bt_trades")||"[]");}catch{return[];}});
  const [form,setForm]=useState(emptyForm);
  const [tab,setTab]=useState("log");
  const [editId,setEditId]=useState(null);
  const [delId,setDelId]=useState(null);

  useEffect(()=>{localStorage.setItem("bt_trades",JSON.stringify(trades));},[trades]);

  const pnl=(t)=>{
    const e=parseFloat(t.entry),x=parseFloat(t.exit),s=parseFloat(t.size);
    if(isNaN(e)||isNaN(x)||isNaN(s))return null;
    return t.direction==="多"?(x-e)*s:(e-x)*s;
  };

  const stats=()=>{
    const ps=trades.map(pnl).filter(v=>v!==null);
    if(!ps.length)return null;
    const wins=ps.filter(v=>v>0),losses=ps.filter(v=>v<0);
    const total=ps.reduce((a,b)=>a+b,0);
    const avgW=wins.length?wins.reduce((a,b)=>a+b,0)/wins.length:0;
    const avgL=losses.length?losses.reduce((a,b)=>a+b,0)/losses.length:0;
    return{total:total.toFixed(2),count:ps.length,winRate:((wins.length/ps.length)*100).toFixed(1),avgWin:avgW.toFixed(2),avgLoss:avgL.toFixed(2),rr:avgL!==0?Math.abs(avgW/avgL).toFixed(2):"—",wins:wins.length,losses:losses.length};
  };

  const cums=()=>{let c=0;return trades.map(t=>{c+=pnl(t)||0;return c;});};

  const handleSetup=(s)=>setForm(f=>({...f,setups:f.setups.includes(s)?f.setups.filter(x=>x!==s):[...f.setups,s]}));

  const handleSubmit=()=>{
    if(!form.symbol||!form.entry||!form.exit||!form.size)return;
    if(editId!==null){setTrades(ts=>ts.map(t=>t.id===editId?{...form,id:editId}:t));setEditId(null);}
    else{setTrades(ts=>[{...form,id:Date.now()},...ts]);}
    setForm(emptyForm);
  };

  const handleEdit=(t)=>{setForm({...t});setEditId(t.id);setTab("log");window.scrollTo(0,0);};
  const handleDelete=(id)=>{setTrades(ts=>ts.filter(t=>t.id!==id));setDelId(null);};

  const exportCSV=()=>{
    const h="日期,類別,商品,方向,進場,出場,口數,盈虧,設置,備註";
    const rows=trades.map(t=>[t.date,t.category,t.symbol,t.direction,t.entry,t.exit,t.size,(pnl(t)||"").toString(),t.setups.join("|"),t.note].join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+h+"\n"+rows],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backtest.csv";a.click();
  };

  const st=stats();
  const cumData=cums();

  const css=`
    .chip{display:inline-block;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid #2a2f3d;transition:all 0.15s;user-select:none;margin:3px;}
    .chip.on{background:#00e5a0;color:#0b0e14;border-color:#00e5a0;font-weight:700;}
    .chip:not(.on):hover{border-color:#00e5a0;color:#00e5a0;}
    .dbtn{flex:1;padding:8px;border-radius:6px;border:1px solid #2a2f3d;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all 0.15s;}
    .dbtn.long.on{background:#00e5a0;color:#0b0e14;border-color:#00e5a0;}
    .dbtn.short.on{background:#ff5f6d;color:#fff;border-color:#ff5f6d;}
    .dbtn:not(.on){background:#141820;color:#6b7280;}
    .tab{padding:8px 20px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:0.05em;border:none;font-family:inherit;transition:all 0.15s;}
    .tab.on{background:#00e5a0;color:#0b0e14;}
    .tab:not(.on){background:transparent;color:#6b7280;}
    .tab:not(.on):hover{color:#c8cdd8;}
    .tr{display:grid;grid-template-columns:80px 60px 80px 50px 75px 75px 55px 85px 1fr 70px;gap:4px;align-items:center;padding:9px 14px;border-bottom:1px solid #141820;font-size:11px;}
    .tr:hover{background:#0e1118;}
    .ibtn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;font-size:12px;color:#6b7280;transition:all 0.15s;}
    .ibtn:hover{color:#c8cdd8;background:#1e2330;}
    .sbtn{width:100%;padding:12px;border-radius:8px;border:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:0.05em;transition:all 0.2s;}
    .sbtn:not(:disabled){background:#00e5a0;color:#0b0e14;}
    .sbtn:not(:disabled):hover{background:#00ffb3;}
    .sbtn:disabled{background:#1e2330;color:#444;cursor:not-allowed;}
    .card{background:#0e1118;border:1px solid #1e2330;border-radius:10px;padding:16px 20px;}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;}
    .modal{background:#141820;border:1px solid #2a2f3d;border-radius:12px;padding:24px;width:300px;}
    .label{font-size:11px;color:#4a5060;margin-bottom:5px;letter-spacing:0.05em;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
    .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
  `;

  return (
    <>
      <style>{css}</style>
      {/* Header */}
      <div style={{background:"#0e1118",borderBottom:"1px solid #1e2330",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontSize:17,fontWeight:700,color:"#fff",letterSpacing:"0.05em"}}>BACKTEST<span style={{color:"#00e5a0"}}>_JOURNAL</span></div>
          <div style={{fontSize:10,color:"#4a5060",marginTop:2}}>手動回測記錄系統</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <button style={{background:"none",border:"1px solid #2a2f3d",color:"#6b7280",borderRadius:6,padding:"6px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:11}} onClick={exportCSV}>↓ 匯出 CSV</button>
          <button className={`tab ${tab==="log"?"on":""}`} onClick={()=>setTab("log")}>記錄</button>
          <button className={`tab ${tab==="stats"?"on":""}`} onClick={()=>setTab("stats")}>統計</button>
        </div>
      </div>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"20px 14px 60px"}}>
        {tab==="log" && <>
          {/* Form */}
          <div className="card" style={{marginBottom:20}}>
            <div style={{fontSize:11,color:"#4a5060",marginBottom:14,letterSpacing:"0.1em"}}>{editId?"✏️ 編輯交易":"＋ 新增交易"}</div>
            <div className="grid">
              <div><div className="label">日期</div><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
              <div>
                <div className="label">類別</div>
                <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value,symbol:""}))}>
                  <option value="futures">期貨</option>
                  <option value="forex">外匯 Forex</option>
                  <option value="crypto">加密貨幣</option>
                </select>
              </div>
              <div>
                <div className="label">商品</div>
                <select value={form.symbol} onChange={e=>setForm(f=>({...f,symbol:e.target.value}))}>
                  <option value="">選擇商品</option>
                  {SYMBOLS[form.category].map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div>
                <div className="label">方向</div>
                <div style={{display:"flex",gap:6}}>
                  <button className={`dbtn long ${form.direction==="多"?"on":""}`} onClick={()=>setForm(f=>({...f,direction:"多"}))}>▲ 多</button>
                  <button className={`dbtn short ${form.direction==="空"?"on":""}`} onClick={()=>setForm(f=>({...f,direction:"空"}))}>▼ 空</button>
                </div>
              </div>
              <div><div className="label">進場價</div><input type="number" placeholder="0.00" value={form.entry} onChange={e=>setForm(f=>({...f,entry:e.target.value}))}/></div>
              <div><div className="label">出場價</div><input type="number" placeholder="0.00" value={form.exit} onChange={e=>setForm(f=>({...f,exit:e.target.value}))}/></div>
              <div><div className="label">口數 / 手數</div><input type="number" placeholder="1" value={form.size} onChange={e=>setForm(f=>({...f,size:e.target.value}))}/></div>
            </div>

            <div style={{marginTop:14}}>
              <div className="label">設置選項（可多選）</div>
              <div>{SETUPS.map(s=><span key={s} className={`chip ${form.setups.includes(s)?"on":""}`} onClick={()=>handleSetup(s)}>{s}</span>)}</div>
            </div>

            <div style={{marginTop:12}}>
              <div className="label">備註</div>
              <textarea value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} rows={2} placeholder="補充說明..." style={{resize:"vertical"}}/>
            </div>

            <div style={{display:"flex",gap:10,marginTop:14}}>
              <button className="sbtn" disabled={!form.symbol||!form.entry||!form.exit||!form.size} onClick={handleSubmit}>
                {editId?"✓ 更新交易":"＋ 新增交易"}
              </button>
              {editId&&<button onClick={()=>{setEditId(null);setForm(emptyForm);}} style={{padding:"12px 18px",background:"#1e2330",border:"none",borderRadius:8,color:"#6b7280",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>取消</button>}
            </div>
          </div>

          {/* Table */}
          <div className="card" style={{padding:0,overflow:"hidden"}}>
            <div className="tr" style={{background:"#0b0e14",color:"#4a5060",fontSize:10,letterSpacing:"0.08em",fontWeight:700}}>
              <span>日期</span><span>類別</span><span>商品</span><span>方向</span><span>進場</span><span>出場</span><span>口數</span><span>盈虧($)</span><span>設置</span><span style={{textAlign:"right"}}>操作</span>
            </div>
            {trades.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#2a2f3d",fontSize:13}}>尚無交易記錄</div>}
            {trades.map(t=>{
              const p=pnl(t);
              return(
                <div key={t.id} className="tr">
                  <span style={{color:"#6b7280"}}>{t.date}</span>
                  <span style={{color:"#4a5060",fontSize:10}}>{t.category==="futures"?"期貨":t.category==="forex"?"Forex":"Crypto"}</span>
                  <span style={{color:"#fff",fontWeight:600}}>{t.symbol}</span>
                  <span style={{color:t.direction==="多"?"#00e5a0":"#ff5f6d",fontWeight:700}}>{t.direction==="多"?"▲多":"▼空"}</span>
                  <span>{t.entry}</span>
                  <span>{t.exit}</span>
                  <span style={{color:"#6b7280"}}>{t.size}</span>
                  <span style={{color:p===null?"#4a5060":p>=0?"#00e5a0":"#ff5f6d",fontWeight:700}}>{fmt(p)}</span>
                  <span style={{color:"#4a5060",fontSize:10}}>{t.setups.join(", ")||"—"}</span>
                  <span style={{textAlign:"right"}}>
                    <button className="ibtn" onClick={()=>handleEdit(t)}>✏️</button>
                    <button className="ibtn" onClick={()=>setDelId(t.id)}>🗑️</button>
                  </span>
                </div>
              );
            })}
          </div>
        </>}

        {tab==="stats" && <>
          {!st?<div style={{textAlign:"center",padding:"60px 0",color:"#2a2f3d"}}>尚無足夠資料</div>:<>
            <div className="statgrid">
              {[
                {label:"總盈虧",value:`$${st.total}`,color:parseFloat(st.total)>=0?"#00e5a0":"#ff5f6d"},
                {label:"總交易次數",value:st.count,color:"#fff"},
                {label:"勝率",value:`${st.winRate}%`,color:"#fff"},
                {label:"獲勝 / 虧損",value:`${st.wins} / ${st.losses}`,color:"#fff"},
                {label:"平均獲利",value:`$${st.avgWin}`,color:"#00e5a0"},
                {label:"平均虧損",value:`$${st.avgLoss}`,color:"#ff5f6d"},
                {label:"風報比 R:R",value:st.rr,color:"#fff"},
              ].map(s=>(
                <div key={s.label} className="card">
                  <div style={{fontSize:10,color:"#4a5060",marginBottom:8,letterSpacing:"0.08em"}}>{s.label}</div>
                  <div style={{fontSize:22,fontWeight:700,color:s.color}}>{s.value}</div>
                </div>
              ))}
            </div>

            {/* Equity Curve */}
            <div className="card" style={{marginBottom:20}}>
              <div style={{fontSize:10,color:"#4a5060",marginBottom:12,letterSpacing:"0.08em"}}>累積損益曲線</div>
              <div style={{overflowX:"auto"}}>
                {(()=>{
                  const data=cumData;
                  if(data.length<2)return<div style={{color:"#4a5060",fontSize:12}}>需要更多資料</div>;
                  const min=Math.min(0,...data),max=Math.max(0,...data),range=max-min||1;
                  const W=Math.max(500,trades.length*28),H=100,pad=10;
                  const x=i=>pad+(i/(data.length-1))*(W-pad*2);
                  const y=v=>pad+(1-(v-min)/range)*(H-pad*2);
                  const zero=y(0);
                  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
                  const last=data[data.length-1];
                  return(
                    <svg width={W} height={H} style={{display:"block"}}>
                      <line x1={pad} y1={zero} x2={W-pad} y2={zero} stroke="#2a2f3d" strokeWidth="1" strokeDasharray="4,4"/>
                      <polyline points={pts} fill="none" stroke={last>=0?"#00e5a0":"#ff5f6d"} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
                      {data.map((v,i)=><circle key={i} cx={x(i)} cy={y(v)} r="3" fill={v>=0?"#00e5a0":"#ff5f6d"}/>)}
                    </svg>
                  );
                })()}
              </div>
            </div>

            {/* Setup breakdown */}
            <div className="card">
              <div style={{fontSize:10,color:"#4a5060",marginBottom:14,letterSpacing:"0.08em"}}>設置分析</div>
              {SETUPS.map(s=>{
                const rel=trades.filter(t=>t.setups.includes(s));
                const ps=rel.map(pnl).filter(v=>v!==null);
                const wins=ps.filter(v=>v>0).length;
                const total=ps.reduce((a,b)=>a+b,0);
                return(
                  <div key={s} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:"1px solid #1e2330"}}>
                    <span style={{fontSize:12,color:"#c8cdd8"}}>{s}</span>
                    <div style={{display:"flex",gap:16,fontSize:12}}>
                      <span style={{color:"#6b7280"}}>{ps.length} 筆</span>
                      <span style={{color:"#fff"}}>{ps.length?`${((wins/ps.length)*100).toFixed(0)}% 勝率`:"—"}</span>
                      <span style={{color:total>=0?"#00e5a0":"#ff5f6d",fontWeight:700}}>{ps.length?`$${total.toFixed(2)}`:"—"}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </>}
        </>}
      </div>

      {delId&&(
        <div className="overlay" onClick={()=>setDelId(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:15,fontWeight:700,color:"#fff",marginBottom:8}}>確定刪除？</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:20}}>此操作無法還原</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>handleDelete(delId)} style={{flex:1,padding:"10px",background:"#ff5f6d",border:"none",borderRadius:8,color:"#fff",fontFamily:"inherit",fontWeight:700,cursor:"pointer"}}>刪除</button>
              <button onClick={()=>setDelId(null)} style={{flex:1,padding:"10px",background:"#1e2330",border:"none",borderRadius:8,color:"#6b7280",fontFamily:"inherit",cursor:"pointer"}}>取消</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
